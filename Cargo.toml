[package]
name = "upnotify"
description = "A tool that prints to stdout when the status of a URL changes."
version = "0.1.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.5", features = ["blocking", "native-tls-vendored"] }
http = "1.1.0"
clap = { version = "4.5.13", features = ["cargo"] }

[[bin]]
name = "upnotify"